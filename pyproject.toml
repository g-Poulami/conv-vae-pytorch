[project]
name = "conv-vae-pytorch"
version = "0.1.0"
description = "A small convolutional variational autoencoder in PyTorch, trained on MNIST and MedMNIST"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Poulami Ghosh" }]
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "matplotlib>=3.7", "medmnist>=3.0"]

[tool.setuptools]
packages = ["vae"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
